version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: homeflow-db
    environment:
      POSTGRES_DB: homeflow
      POSTGRES_USER: homeflow
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: